services:
  - type: web
    name: ulis-start-assistant
    runtime: node
    plan: free
    region: singapore
    rootDir: ulis-start/server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /tmp/data
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: VOYAGE_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: ANTHROPIC_EFFORT
        value: low
      - key: ALLOWED_ORIGINS
        value: https://ulis-start.expo.app